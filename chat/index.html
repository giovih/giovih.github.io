<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI Chat">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>AI Chat · OpenRouter</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1f232c; --border: #2a2f3a;
    --text: #e6e8ee; --muted: #8b93a7; --accent: #7c5cff; --accent2: #5b8cff;
    --user: #2b2f73; --danger: #ff5c7a; --ok: #3ddc97;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    padding-top: max(12px, env(safe-area-inset-top));
    background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  header .model { font-size: 12px; color: var(--muted); display: block; font-weight: 400;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60vw; }
  button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; color: #fff; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: min(760px, 88%); padding: 10px 14px; border-radius: 16px; white-space: pre-wrap;
    word-wrap: break-word; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: var(--panel2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.error { align-self: center; background: rgba(255,92,122,.12); border: 1px solid var(--danger); color: #ffc2cd; font-size: 14px; }
  .msg code { background: #0b0d11; padding: 1px 5px; border-radius: 5px; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  .msg pre { background: #0b0d11; padding: 10px; border-radius: 8px; overflow-x: auto; white-space: pre; margin: 6px 0; }
  .msg pre code { background: none; padding: 0; }
  .empty { margin: auto; text-align: center; color: var(--muted); padding: 20px; }
  .empty b { color: var(--text); font-size: 18px; display: block; margin-bottom: 6px; }
  .typing span { display: inline-block; width: 7px; height: 7px; margin: 0 2px; border-radius: 50%;
    background: var(--muted); animation: b 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes b { 0%,80%,100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
  form#composer { display: flex; gap: 8px; padding: 12px; padding-bottom: max(12px, env(safe-area-inset-bottom));
    background: var(--panel); border-top: 1px solid var(--border); }
  textarea, input, select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 12px; width: 100%; outline: none; }
  textarea:focus, input:focus, select:focus { border-color: var(--accent); }
  #input { resize: none; max-height: 160px; min-height: 44px; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 16px;
    width: min(480px, 94vw); padding: 20px; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h2 { margin: 0 0 14px; font-size: 18px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .hint a { color: var(--accent2); }
  .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
  .row .danger { color: var(--danger); margin-right: auto; }
  .keywrap { display: flex; gap: 6px; } .keywrap button { flex-shrink: 0; }
  #toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--panel2);
    border: 1px solid var(--ok); padding: 8px 14px; border-radius: 10px; font-size: 14px; opacity: 0;
    transition: opacity .25s; pointer-events: none; }
  #toast.show { opacity: 1; }
  #lock { position: fixed; inset: 0; z-index: 99; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 16px; }
  #lock form { width: min(340px, 100%); background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 22px; text-align: center; }
  #lock h2 { margin: 0 0 14px; font-size: 18px; }
  #lock button { width: 100%; margin-top: 10px; }
  #lockMsg { font-size: 13px; color: var(--danger); min-height: 20px; margin-top: 10px; }
</style>
</head>
<body>
<header>
  <h1>AI Chat<span class="model" id="modelLabel"></span></h1>
  <button id="clearBtn" title="Nuova chat">🗑️</button>
  <button id="settingsBtn" title="Impostazioni">⚙️</button>
</header>

<main id="messages"></main>

<form id="composer">
  <textarea id="input" rows="1" placeholder="Scrivi un messaggio… (Enter per inviare, Shift+Enter per andare a capo)"></textarea>
  <button class="primary" id="sendBtn" type="submit">Invia</button>
</form>

<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <h2>Impostazioni</h2>
    <label for="apiKey">API Key OpenRouter</label>
    <div class="keywrap">
      <input id="apiKey" type="password" placeholder="sk-or-v1-..." autocomplete="off" spellcheck="false">
      <button type="button" id="toggleKey">👁️</button>
    </div>
    <div class="hint">Salvata solo nel tuo browser (localStorage). Ottienila su <a href="https://openrouter.ai/keys" target="_blank" rel="noopener">openrouter.ai/keys</a>.</div>

    <label for="model">Modello</label>
    <select id="model"></select>
    <label for="customModel">…oppure ID modello personalizzato</label>
    <input id="customModel" placeholder="es. meta-llama/llama-3.3-70b-instruct:free" spellcheck="false">

    <label for="systemPrompt">System prompt (opzionale)</label>
    <textarea id="systemPrompt" rows="3" placeholder="Sei un assistente utile."></textarea>

    <div class="row">
      <button type="button" class="danger" id="deleteKey">Elimina key</button>
      <button value="cancel" formnovalidate>Annulla</button>
      <button class="primary" id="saveSettings" value="save">Salva</button>
    </div>
  </form>
</dialog>

<div id="toast"></div>

<div id="lock">
  <form id="lockForm">
    <h2>🔒 Accesso protetto</h2>
    <input id="pwd" type="password" placeholder="Password" autocomplete="current-password" autofocus>
    <button class="primary" id="pwdBtn">Entra</button>
    <div id="lockMsg"></div>
  </form>
</div>

<script>
(() => {
  const API_URL = "https://openrouter.ai/api/v1/chat/completions";
  const MODELS = [
    { id: "cognitivecomputations/dolphin-mistral-24b-venice-edition:free", name: "Dolphin Mistral 24B Venice (free)" },
    { id: "openrouter/free", name: "OpenRouter Free (router automatico)" },
    { id: "meta-llama/llama-3.3-70b-instruct:free", name: "Llama 3.3 70B Instruct (free)" },
    { id: "deepseek/deepseek-chat-v3-0324:free", name: "DeepSeek V3 (free)" },
    { id: "google/gemma-3-27b-it:free", name: "Gemma 3 27B (free)" },
  ];
  const LS = { key: "orchat.apiKey", model: "orchat.model", history: "orchat.history", system: "orchat.system" };

  const $ = (id) => document.getElementById(id);
  const els = {
    messages: $("messages"), input: $("input"), form: $("composer"), send: $("sendBtn"),
    settings: $("settings"), apiKey: $("apiKey"), model: $("model"), custom: $("customModel"),
    system: $("systemPrompt"), modelLabel: $("modelLabel"), toast: $("toast"),
  };

  const store = {
    get(k, d = null) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };

  let history = [];
  try { history = JSON.parse(store.get(LS.history, "[]")) || []; } catch { history = []; }
  let busy = false;

  const getModel = () => store.get(LS.model, MODELS[0].id);
  const saveHistory = () => store.set(LS.history, JSON.stringify(history));

  function toast(text) {
    els.toast.textContent = text; els.toast.classList.add("show");
    clearTimeout(toast.t); toast.t = setTimeout(() => els.toast.classList.remove("show"), 1800);
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // Minimal formatting: code blocks, inline code, bold
  function format(text) {
    const parts = escapeHtml(text).split(/```(?:[\w-]*)\n?([\s\S]*?)```/g);
    return parts.map((p, i) => i % 2
      ? `<pre><code>${p}</code></pre>`
      : p.replace(/`([^`\n]+)`/g, "<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
    ).join("");
  }

  function addBubble(role, content) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    if (role === "assistant") div.innerHTML = format(content);
    else div.textContent = content;
    els.messages.appendChild(div);
    els.messages.scrollTop = els.messages.scrollHeight;
    return div;
  }

  function render() {
    els.messages.innerHTML = "";
    if (!history.length) {
      els.messages.innerHTML = store.get(LS.key)
        ? `<div class="empty"><b>Ciao! 👋</b>Inizia una conversazione.</div>`
        : `<div class="empty"><b>Benvenuto</b>Apri le ⚙️ Impostazioni e inserisci la tua API Key di OpenRouter per iniziare.</div>`;
    }
    history.forEach((m) => addBubble(m.role, m.content));
    const m = getModel();
    els.modelLabel.textContent = (MODELS.find((x) => x.id === m) || { name: m }).name;
  }

  function showError(msg) { addBubble("error", "⚠️ " + msg); }

  async function send(text) {
    const key = store.get(LS.key);
    if (!key) { showError("API Key mancante. Inseriscila nelle Impostazioni."); openSettings(); return; }
    if (!navigator.onLine) { showError("Sei offline. Controlla la connessione."); return; }

    if (!history.length) els.messages.innerHTML = "";
    history.push({ role: "user", content: text });
    saveHistory();
    addBubble("user", text);

    busy = true; els.send.disabled = true;
    const typing = addBubble("assistant", "");
    typing.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';

    const sys = store.get(LS.system, "").trim();
    const messages = (sys ? [{ role: "system", content: sys }] : []).concat(history);

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + key,
          "Content-Type": "application/json",
          "HTTP-Referer": location.origin,
          "X-Title": "AI Chat",
        },
        body: JSON.stringify({ model: getModel(), messages }),
      });
      let data = null;
      try { data = await res.json(); } catch {}

      if (!res.ok || data?.error) {
        const apiMsg = data?.error?.message || res.statusText || "Errore sconosciuto";
        const hints = {
          401: "API Key non valida o revocata.",
          402: "Credito insufficiente.",
          403: "Richiesta bloccata dalla moderazione.",
          404: "Modello non trovato o non disponibile.",
          408: "Timeout della richiesta.",
          429: "Troppe richieste (rate limit). Riprova tra poco.",
          502: "Il provider del modello non risponde.",
          503: "Nessun provider disponibile per questo modello.",
        };
        const code = data?.error?.code || res.status;
        throw new Error(`${hints[code] ? hints[code] + " " : ""}(${code}) ${apiMsg}`);
      }

      const reply = data?.choices?.[0]?.message?.content;
      if (!reply) throw new Error("Risposta vuota dal modello.");
      history.push({ role: "assistant", content: reply });
      saveHistory();
      typing.innerHTML = format(reply);
    } catch (err) {
      typing.remove();
      // Remove the unanswered user message so it doesn't pollute context
      history.pop(); saveHistory();
      const msg = err instanceof TypeError ? "Errore di rete: impossibile contattare OpenRouter." : err.message;
      showError(msg);
      els.input.value = els.input.value || text;
    } finally {
      busy = false; els.send.disabled = false;
      els.messages.scrollTop = els.messages.scrollHeight;
      els.input.focus();
    }
  }

  function autosize() { els.input.style.height = "auto"; els.input.style.height = Math.min(els.input.scrollHeight, 160) + "px"; }

  els.form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = els.input.value.trim();
    if (!text || busy) return;
    els.input.value = ""; autosize();
    send(text);
  });
  els.input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); els.form.requestSubmit(); }
  });
  els.input.addEventListener("input", autosize);

  // Settings
  els.model.innerHTML = MODELS.map((m) => `<option value="${m.id}">${m.name}</option>`).join("");
  function openSettings() {
    els.apiKey.value = store.get(LS.key, "");
    const m = getModel();
    const known = MODELS.some((x) => x.id === m);
    els.model.value = known ? m : MODELS[0].id;
    els.custom.value = known ? "" : m;
    els.system.value = store.get(LS.system, "");
    els.settings.showModal();
  }
  $("settingsBtn").onclick = openSettings;
  $("toggleKey").onclick = () => { els.apiKey.type = els.apiKey.type === "password" ? "text" : "password"; };
  $("deleteKey").onclick = () => {
    store.del(LS.key); els.apiKey.value = ""; toast("API Key eliminata"); render();
  };
  $("saveSettings").onclick = (e) => {
    const key = els.apiKey.value.trim();
    if (key && !key.startsWith("sk-")) {
      e.preventDefault(); toast("La key dovrebbe iniziare con sk-or-…"); return;
    }
    key ? store.set(LS.key, key) : store.del(LS.key);
    store.set(LS.model, els.custom.value.trim() || els.model.value);
    store.set(LS.system, els.system.value);
    toast("Impostazioni salvate ✓");
    setTimeout(render);
  };
  $("clearBtn").onclick = () => {
    if (!history.length || confirm("Cancellare la cronologia della chat?")) {
      history = []; saveHistory(); render();
    }
  };

  // Password gate: 3 attempts, then permanently locked on this browser
  const PWD_HASH = "caabb5671318567c087aeb9e533fabe99a8a9c60320b2e247e70f6ee2b159ee4";
  const MAX_TRIES = 3;
  const lock = $("lock"), lockMsg = $("lockMsg"), pwd = $("pwd"), pwdBtn = $("pwdBtn");
  const sha256 = async (s) => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)))]
    .map((b) => b.toString(16).padStart(2, "0")).join("");
  const fails = () => parseInt(store.get("orchat.fails", "0"), 10) || 0;
  function setBlocked() {
    pwd.disabled = pwdBtn.disabled = true;
    lockMsg.textContent = "Accesso bloccato definitivamente.";
  }
  function unlock() {
    lock.remove();
    render();
    if (!store.get(LS.key)) openSettings();
  }
  if (sessionStorage.getItem("orchat.ok") === "1") unlock();
  else if (fails() >= MAX_TRIES) setBlocked();
  $("lockForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (fails() >= MAX_TRIES) return setBlocked();
    if (await sha256(pwd.value) === PWD_HASH) {
      store.set("orchat.fails", "0");
      try { sessionStorage.setItem("orchat.ok", "1"); } catch {}
      unlock();
    } else {
      const n = fails() + 1;
      store.set("orchat.fails", String(n));
      pwd.value = "";
      if (n >= MAX_TRIES) setBlocked();
      else lockMsg.textContent = `Password errata. Tentativi rimasti: ${MAX_TRIES - n}`;
    }
  });
})();
</script>
</body>
</html>
